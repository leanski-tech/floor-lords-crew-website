        <h1>The Floor Lords Crew | Boston Hip Hop &amp; Breaking Since 1981</h1>
        <p>The Floor Lords (floorlords.org) are Boston's longest-running hip hop breaking crew, founded in 1981. One of the most celebrated b-boy crews in the United States, with 45 years of culture, community, and performance.</p>

        <h2>About The Floor Lords</h2>
        <p>Founded in Boston, Massachusetts in 1981 through the merger of two breaking crews, the Floor Lords have spent four and a half decades defining hip hop culture in New England and beyond. They practice and teach all five elements of hip hop: breaking, DJing, MCing, graffiti, and knowledge.</p>

        <h2>Film &amp; Television</h2>
        <ul>
          <li>Krush Groove (1985)</li>
          <li>Live with Regis, Donahue, Southie</li>
          <li>Step Up 3D (2010)</li>
          <li>In The Heights (2021)</li>
        </ul>

        <h2>Major Performances</h2>
        <p>The Floor Lords have performed alongside RUN DMC, Madonna, Jennifer Lopez, and many more major artists across television, film, and live stages.</p>

        <h2>Brand Collaborations</h2>
        <ul>
          <li>Saucony — first-ever official breakdance sneaker</li>
          <li>Red Bull, Converse, Puma, Reebok, Tommy Hilfiger</li>
        </ul>

        <h2>Floor Lords Day</h2>
        <p>August 6 is official Floor Lords Day in the City of Boston, declared by the former Mayor of Boston in recognition of the crew's cultural contribution to the city.</p>

        <h2>FL Studio — Harvard Square</h2>
        <p>The Floor Lords operate FL Studio, a dance studio and community space in Harvard Square, Cambridge, Massachusetts offering breaking classes, workshops, and youth programs.</p>

        <h2>45th Anniversary Weekend — September 11–13, 2026</h2>
        <p>Three-day celebration in Boston featuring:</p>
        <ul>
          <li>Downtown Throwdown — breaking battle open to the public</li>
          <li>Mass Appeal — hip hop showcase and celebration</li>
        </ul>
